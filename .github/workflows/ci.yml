name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify (default suite)
        run: ./mvnw -B verify

      - name: Upload SBOM artifact
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            */target/bom.json
          if-no-files-found: warn

  postgres-it:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent4j_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: PostgreSQL Integration Profile
        run: >
          ./mvnw -B verify
          -Dagent4j.surefire.excludedGroups=
          -Dgroups=postgres
          -Dsurefire.failIfNoSpecifiedTests=false
        env:
          # agent-workflow/agent-scheduler PG ITs probe these (PostgresIT.probe):
          # AGENT4J_IT_PG_URL enables the suite; mirrors docs/harness-contract.md.
          AGENT4J_IT_PG_URL: jdbc:postgresql://localhost:5432/agent4j_it
          AGENT4J_IT_PG_USER: postgres
          AGENT4J_IT_PG_PASSWORD: postgres

  transport-it:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
        profile: [mcp-it, a2a-it]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Transport Integration Profile (${{ matrix.profile }})
        run: >
          ./mvnw -B verify
          -Dagent4j.surefire.excludedGroups=
          -Dgroups=${{ matrix.profile }}
          -Dsurefire.failIfNoSpecifiedTests=false

  sandbox-escape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    services:
      docker:
        image: docker:27-dind
        # Docker-in-Docker: DockerDaemonProbeIT records daemon presence
        # (the loud-fail contract holds either way); red-team suites are
        # host-local and unaffected.
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Sandbox escape regression + container probe
        run: >
          ./mvnw -B verify
          -Dagent4j.surefire.excludedGroups=postgres,mcp-it,a2a-it
          -Dgroups=sandbox-escape
          -Dsurefire.failIfNoSpecifiedTests=false

  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: API compatibility gate (japicmp vs 0.1.3)
        run: ./mvnw -B verify -Papi-compat -DskipTests

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Generate SBOM (no tests)
        run: ./mvnw -B package -DskipTests
      - name: Collect aggregate SBOM
        run: |
          mkdir -p sbom-out
          # makeAggregateBom writes per-module target/bom.json; the BOM
          # module's report covers the full dependency tree.
          cp seven-agent-bom/target/bom.json sbom-out/aggregate-bom.json
      - name: Anchore grype scan of the aggregate SBOM
        uses: anchore/scan-action@v7
        with:
          sbom-artifact: sbom-out/aggregate-bom.json
          fail-build: true
          severity-cutoff: high
      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: ${{ github.workspace }}/grype-scan-report.json
          if-no-files-found: warn
